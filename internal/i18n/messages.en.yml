# Deterministic flaky-test detector (ADR-0022). Finding text for the static
# internal/flaky pre-pass; localized like LLM findings (output language).
flaky.hard_sleep.title: "Test uses a hard-coded sleep for synchronization"
flaky.hard_sleep.description: "Fixed sleeps make a test timing-dependent: it passes on a fast machine and fails under CI load, producing flaky results that erode trust in the suite."
flaky.hard_sleep.suggestion: "Replace the fixed delay with a condition-based wait — poll until the expected state, or use your framework's Eventually/waitFor helper — so the test reacts to actual readiness instead of wall-clock time."
flaky.unseeded_random.title: "Test relies on unseeded randomness"
flaky.unseeded_random.description: "A random source without a fixed seed yields different values on every run, so assertions can pass or fail non-deterministically."
flaky.unseeded_random.suggestion: "Seed the generator with a constant in the test, or inject a deterministic fake, so the run is reproducible."
flaky.brittle_selector.title: "Test uses a brittle, position-based selector"
flaky.brittle_selector.description: "Index- or position-based selectors (:nth-child, .eq(n)/.nth(n), absolute XPath) break when unrelated markup shifts, so the test fails on changes it was never meant to cover — a common source of UI flakiness."
flaky.brittle_selector.suggestion: "Target a stable, intent-revealing handle instead — a data-testid/test id, an accessible role or label, or a semantic text match — so the selector survives layout changes."
flaky.over_mock.title: "Test sets up an excessive number of mocks"
flaky.over_mock.description: "A test that stubs many collaborators is pinned to the implementation rather than the behaviour: small refactors break it even when the behaviour is unchanged, and over-mocked seams hide real integration defects."
flaky.over_mock.suggestion: "Mock only the true external boundaries (network, clock, randomness); prefer real collaborators or lightweight fakes, and split the test so each case exercises one behaviour with a minimal set of doubles."
flaky.time_dependency.title: "Test assertion depends on the wall clock"
flaky.time_dependency.description: "Asserting against a non-injected clock (time.Now, Date.now, datetime.now, new Date(), System.currentTimeMillis) couples the result to when the test runs, so it can pass now and fail later — at midnight, across a DST boundary, or under CI scheduling jitter."
flaky.time_dependency.suggestion: "Inject the clock (pass a fixed time or a fake clock) and assert against that fixed value, so the test is reproducible regardless of when it runs."
flaky.sandbox.flaky: "Sandbox rerun confirmed flaky: the test produced both a pass and a fail across %d isolated reruns under identical conditions."
flaky.sandbox.real_failure: "Sandbox rerun shows a real failure, not flakiness: the test failed every one of %d isolated reruns — fix the test rather than quarantining it."
flaky.sandbox.transient: "Sandbox rerun did not reproduce the flake: the test passed all %d isolated reruns, so the original signal was likely a one-off."
flaky.sandbox.command_invalid: "Invalid review.sandbox_command: %s"
flaky.sandbox.running: "Sandbox rerun: running `%s` up to %d times per flagged test."
flaky.sandbox.no_test_name: "Sandbox rerun skipped for %s:%d — could not resolve the enclosing test name."
