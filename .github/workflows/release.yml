name: Release

on:
  push:
    tags:
      - 'v*'
  # workflow_dispatch lets us re-run a release manually against an
  # existing tag (e.g. after a transient failure, or when a tag was
  # re-pushed at the same SHA and GitHub deduped the push event).
  # Trigger: `gh workflow run release.yml --ref v0.4.0`
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0). Used for logs only; the actual ref is determined by --ref at dispatch time.'
        required: false
        default: ''

# Visibility lifecycle (ADR-0013 §3):
#   - v0.0.x – v0.3.x: private repo; goreleaser ran with --skip=publish
#     to validate the config without shipping anything externally. The
#     visibility flip happened at the end of Phase 8 (just before v0.4.0).
#   - v0.4.0+: full publish. Binaries land on the GitHub Release page;
#     formulas/manifests go to CommitBrief/homebrew-tap and
#     CommitBrief/scoop-bucket via HOMEBREW_TAP_GITHUB_TOKEN (PAT with
#     repo scope; the default GITHUB_TOKEN cannot write to those repos).

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Pre-release safety checks
        run: bash scripts/release-check.sh

      - name: License audit
        run: bash scripts/license-check.sh

      # ADR-0039, narrowed by ADR-0041: guards against a stale
      # internal/meta/surface.json shipping in a tag (see .goreleaser.yaml
      # archives.files). `main`'s branch protection makes this practically
      # redundant with the `docs-check` CI job most tags will already
      # have passed, but ADR-0041's Risks section calls for keeping it in
      # both workflows — it is one cheap step (go is already being set up
      # for goreleaser above) against a tag that points at a commit CI
      # never actually gated — a re-tagged SHA, an admin override, or a
      # future change to the protection rules.
      - name: Docs drift check
        run: bash scripts/docs-check.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # D-VP-2 (.ssot/plans/2026-09-23-version-pins): keep
  # CommitBrief/commitbrief-action's README.md version pins from ever being
  # hand-edited. Runs only after goreleaser has actually published the tag,
  # and only for stable releases — a `-rc`/`-beta` prerelease tag is never a
  # version anyone should pin their CI to. Opens a PR in the action repo;
  # merging stays a maintainer action (see CLAUDE.md "Sürüm çıkınca …").
  pin-action-readme:
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commitbrief (for the pin script)
        uses: actions/checkout@v4

      - name: Checkout commitbrief-action
        uses: actions/checkout@v4
        with:
          repository: CommitBrief/commitbrief-action
          # Reuses the existing Homebrew-tap PAT (classic, repo scope) — it
          # is the only cross-repo write credential this workflow already
          # holds; the default GITHUB_TOKEN can't push outside this repo.
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: commitbrief-action

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Pin README version examples
        run: bash scripts/pin-action-readme.sh commitbrief-action/README.md "${{ steps.tag.outputs.tag }}"

      - name: Check for changes
        id: diff
        working-directory: commitbrief-action
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pin PR
        if: steps.diff.outputs.changed == 'true'
        working-directory: commitbrief-action
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          branch="chore/pin-${TAG}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists on origin; assuming a pin PR is already open, skipping"
            exit 0
          fi

          git config user.name "commitbrief-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md
          git commit -m "docs: pin README examples to ${TAG}"
          git push origin "$branch"

          gh pr create \
            --title "docs: pin README examples to ${TAG}" \
            --body "Pins the \`version:\` workflow examples and the Inputs table's \`version\` example in README.md to ${TAG}. Opened automatically by the commitbrief release workflow on every stable tag." \
            --head "$branch"
