version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      dependencies-minor-patch:
        update-types: ["minor", "patch"]
    # These releases raise the go directive to 1.26; the module targets
    # Go 1.25. Drop these entries when the toolchain moves to 1.26.
    ignore:
      - dependency-name: "github.com/go-git/go-git/v5"
        versions: [">= 5.19.3"]
      - dependency-name: "golang.org/x/crypto"
        versions: [">= 0.56.0"]
